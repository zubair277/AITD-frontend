server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Enable Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Serve the static site index at root
    location = / {
        try_files /site/aitd.org/index.html =404;
    }

    # Route static asset requests to the correct site directory
    location ~* ^/(assets|images|site)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /site/aitd.org$uri =404;
    }

    # Route JS/CSS/fonts by extension directly
    location ~* \.(js|css|woff|woff2|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico|mp4|webm|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /site/aitd.org$uri =404;
    }

    # Route everything else through the static site
    location / {
        try_files /site/aitd.org$uri /site/aitd.org$uri/ /site/aitd.org/index.html;
    }

    # Proxy API requests to the backend container
    location /api {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
